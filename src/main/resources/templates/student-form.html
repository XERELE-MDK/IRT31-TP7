<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" th:href="@{/css/demo.css}" />
</head>
<body>
<h2>Student Registration Form</h2>
<form th:action="@{/processStudentForm}" th:object="${student}" method="POST">
    <label>First name: <input type="text" th:field="*{firstName}" /></label> <br/><br/>
    <label>Last name: <input type="text" th:field="*{lastName}" /></label> <br/><br/>

    <label>Country:
        <select th:field="*{country}">

            <option th:each="tempCountry : ${countries}"
                    th:value="${tempCountry}"
                    th:text="${tempCountry}"></option>
        </select>
    </label> <br/><br/>

    Favorite systems:
    <label th:each="tempSystem : ${systems}">
        <input type="checkbox" th:field="*{favoriteSystems}" th:value="${tempSystem}" />
        <span th:text="${tempSystem}"></span>
    </label> <br/><br/>

    Favorite language:
    <label th:each="tempLang : ${languages}">
        <input type="radio" th:field="*{favoriteLanguage}" th:value="${tempLang}" />
        <span th:text="${tempLang}"></span>
    </label> <br/><br/>

    <input type="submit" value="Submit" />
</form>
</body>
</html>
